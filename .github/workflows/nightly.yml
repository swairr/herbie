name: nightly

on:
  schedule:
    # UTC 19:00 = 北京时间 03:00(GitHub 的 cron 可能延迟几分钟)
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if there are no new commits'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: windows-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for new commits since last nightly
        id: check
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin refs/tags/nightly:refs/tags/nightly || true
          if git rev-parse --verify --quiet 'refs/tags/nightly^{commit}' >/dev/null; then
            prev=$(git rev-parse 'refs/tags/nightly^{commit}')
          else
            prev=''
          fi
          head=$(git rev-parse HEAD)
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          force='${{ inputs.force == true }}'
          if [ -n "$prev" ] && [ "$prev" = "$head" ] && [ "$force" != 'true' ]; then
            echo 'No new commits since last nightly, skip.'
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Build Windows portable
        if: steps.check.outputs.skip == 'false'
        uses: ./.github/actions/build-windows
        with:
          exe-name: Herbie-nightly-win-x64.exe

      - name: Generate release notes
        if: steps.check.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          prev='${{ steps.check.outputs.prev }}'
          {
            echo "Nightly built on $(TZ=Asia/Shanghai date +%Y-%m-%d) (UTC+8)"
            echo
            echo "- commit: ${GITHUB_SHA}"
            if [ -n "$prev" ]; then
              echo
              echo '### Changes since last nightly'
              echo
              git log --oneline "${prev}..HEAD"
            fi
          } > release_body.md
          cat release_body.md

      - name: Generate manifest (latest.json)
        if: steps.check.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          sha=$(sha256sum Herbie-nightly-win-x64.exe | awk '{print $1}')
          built_at=$(TZ=Asia/Shanghai date '+%Y-%m-%dT%H:%M:%S%:z')
          printf '{"sha":"%s","builtAt":"%s","exeUrl":"https://github.com/swairr/herbie/releases/download/nightly/Herbie-nightly-win-x64.exe","exeSha256":"%s"}\n' \
            "${GITHUB_SHA}" "${built_at}" "${sha}" > latest.json
          cat latest.json

      - name: Delete old zip asset
        if: steps.check.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 旧 zip 与裸 exe 双下载入口易误导,清理之;release/资产不存在时静默跳过。
          gh release delete-asset nightly Herbie-nightly-win-x64.zip --repo "$GITHUB_REPOSITORY" --yes || true

      - name: Publish release
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Herbie Nightly
          prerelease: true
          make_latest: 'false'
          body_path: release_body.md
          files: |
            Herbie-nightly-win-x64.exe
            latest.json

      # 冒烟:确认发布后的 latest.json 可访问、sha/exeSha256 与本地资产一致,再推进 nightly tag。
      # 顺序约束:先发布(资产可就地更新)、后移 tag —— 若发布/校验失败,tag 停留在旧 commit,
      # 下次运行的「Check for new commits」会再次检测到新 commit 并重试,通道不自锁。
      - name: Verify published manifest
        if: steps.check.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          local_sha=$(sha256sum Herbie-nightly-win-x64.exe | awk '{print $1}')
          json=$(curl -fsSL https://github.com/swairr/herbie/releases/download/nightly/latest.json)
          echo "$json"
          grep -q "\"sha\":\"${GITHUB_SHA}\"" <<< "$json"
          grep -q "\"exeSha256\":\"${local_sha}\"" <<< "$json"

      - name: Move nightly tag
        if: steps.check.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git tag -f nightly "$GITHUB_SHA"
          git push origin refs/tags/nightly --force

  # Linux 绿色版资产:在 Windows job(已创建 release 并推进 tag)之后串行追加,
  # 仅上传资产、不改 release 元数据(gh release upload),避免与 Windows job 竞争创建 release。
  # 失败不阻塞 Windows 通道;下次有新 commit 时随 nightly 重试。
  nightly-linux:
    needs: nightly
    if: needs.nightly.outputs.skip == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Linux portable
        uses: ./.github/actions/build-linux
        with:
          tarball-name: Herbie-nightly-linux-x64.tar.gz

      - name: Upload Linux asset to nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload nightly Herbie-nightly-linux-x64.tar.gz --clobber --repo "$GITHUB_REPOSITORY"

      # 冒烟:确认发布后的资产可下载且哈希与本地一致(对齐 Windows job 的 manifest 校验)。
      - name: Verify published asset
        shell: bash
        run: |
          set -euo pipefail
          local_sha=$(sha256sum Herbie-nightly-linux-x64.tar.gz | awk '{print $1}')
          curl -fsSL -o /tmp/Herbie-nightly-linux-x64.tar.gz \
            https://github.com/swairr/herbie/releases/download/nightly/Herbie-nightly-linux-x64.tar.gz
          echo "${local_sha}  /tmp/Herbie-nightly-linux-x64.tar.gz" | sha256sum -c -
