name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Node 20 is EOL (Apr 2026). @electron/rebuild@4 (which replaces the stale
          # @electron/node-gyp fork that couldn't detect VS 2026) and its transitive
          # node-abi@4 require node >=22.12, so pin the current LTS.
          node-version: '22'
          cache: 'pnpm'

      - name: Install Electron shared libraries (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unpacked app
        run: pnpm build:dir

      - name: Compress win-unpacked
        run: Compress-Archive -Path release\win-unpacked\* -DestinationPath Herbie-win-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Herbie-win-x64-${{ github.sha }}
          path: Herbie-win-x64.zip
          retention-days: 14
