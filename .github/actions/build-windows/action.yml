name: 'Build Windows portable'
description: 'Shared Windows build steps: setup pnpm/Node, install deps, cargo cache, (optional) cargo tests, tauri build, copy portable exe'
inputs:
  exe-name:
    description: 'File name of the resulting exe (copied to workspace root)'
    required: true
  run-tests:
    description: 'Run cargo tests before building'
    type: boolean
    default: false

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 9
        run_install: false

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash

    - name: Cache cargo (registry + target)
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri
        cache-on-failure: true

    - name: Rust tests
      if: ${{ inputs.run-tests }}
      run: cargo test --manifest-path src-tauri/Cargo.toml
      shell: bash

    - name: Build (no bundle)
      run: pnpm tauri build --no-bundle
      shell: bash
      env:
        # 嵌入 commit SHA → 内嵌 `option_env!("HERBIE_NIGHTLY_SHA")`,客户端据此判断是否有更新。
        HERBIE_NIGHTLY_SHA: ${{ github.sha }}

    - name: Copy exe to workspace root
      run: Copy-Item src-tauri\target\release\herbie.exe "${{ inputs.exe-name }}"
      shell: pwsh
